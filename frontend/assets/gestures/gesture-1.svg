<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" role="img" aria-label="Gesture 1: Index finger open">
  <title>Gesture 1 — Index finger open</title>
  <defs>
    <pattern id="grid1" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(125,249,255,0.16)" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="200" height="232" fill="url(#grid1)" rx="12"/>
  <rect x="0.75" y="0.75" width="198.5" height="230.5" rx="12" fill="none" stroke="rgba(125,249,255,0.16)" stroke-width="1.5"/>
  <!-- dimension ticks -->
  <line x1="14" y1="20" x2="14" y2="212" class="dimline"/>
  <line x1="186" y1="20" x2="186" y2="212" class="dimline"/>
  <text x="100" y="16" text-anchor="middle" class="badge">G-01</text>
  <!-- wrist -->
  <rect x="76" y="178" width="48" height="34" rx="6" class="palm"/>
  <line x1="76" y1="190" x2="124" y2="190" class="wristband"/>
  <line x1="76" y1="200" x2="124" y2="200" class="wristband faint"/>
  <!-- fingers (behind palm top edge) -->
  
      <g class="finger-open">
        <rect x="60" y="40" width="19" height="86" rx="9.5" class="open"/>
        <line x1="63" y1="78.7" x2="76" y2="78.7" class="joint"/>
        <line x1="63" y1="59.4" x2="76" y2="59.4" class="joint faint"/>
        <circle cx="69.5" cy="46" r="1.6" class="tipdot"/>
      </g>

      <g class="finger-folded">
        <rect x="83" y="92" width="20" height="34" rx="8.333333333333334" class="folded"/>
        <path d="M 87 102 Q 93.0 97 99 102" class="foldarc"/>
        <path d="M 88 109 Q 93.0 104 98 109" class="foldarc faint"/>
      </g>

      <g class="finger-folded">
        <rect x="107" y="92" width="20" height="34" rx="8.333333333333334" class="folded"/>
        <path d="M 111 102 Q 117.0 97 123 102" class="foldarc"/>
        <path d="M 112 109 Q 117.0 104 122 109" class="foldarc faint"/>
      </g>

      <g class="finger-folded">
        <rect x="131" y="92" width="17" height="34" rx="7.083333333333334" class="folded"/>
        <path d="M 135 102 Q 139.5 97 144 102" class="foldarc"/>
        <path d="M 136 109 Q 139.5 104 143 109" class="foldarc faint"/>
      </g>
  <!-- palm -->
  <rect x="58" y="112" width="84" height="68" rx="16" class="palm"/>
  <path d="M 72 128 Q 100 122 128 128" class="palmline"/>
  <path d="M 74 144 Q 100 139 126 144" class="palmline faint"/>
  <circle cx="100" cy="158" r="2" class="knuckle"/>
  
      <g class="thumb-folded">
        <path d="M 62 164 Q 86 156 100 138" class="foldthumb"/>
        <ellipse cx="88" cy="150" rx="9" ry="5.5" transform="rotate(-32 88 150)" class="thumbpad"/>
        <circle cx="62" cy="164" r="2.2" class="knuckle"/>
      </g>
  <style>
    .open { fill: rgba(125,249,255,0.10); stroke: #7df9ff; stroke-width: 2.4; }
    .folded { fill: rgba(148,163,184,0.10); stroke: rgba(148,163,184,0.85); stroke-width: 2; stroke-dasharray: 5 3; }
    .halfbody { fill: rgba(251,191,36,0.10); stroke: #fbbf24; stroke-width: 2.4; }
    .palm { fill: rgba(125,249,255,0.05); stroke: #7df9ff; stroke-width: 2.4; }
    .joint { stroke: #7df9ff; stroke-width: 1.4; opacity: .8; }
    .joint.faint, .foldarc.faint, .wristband.faint, .palmline.faint { opacity: .35; }
    .foldarc { fill: none; stroke: rgba(148,163,184,0.9); stroke-width: 1.5; }
    .foldmark { stroke: #fbbf24; stroke-width: 2; }
    .foldchev { fill: none; stroke: #fbbf24; stroke-width: 1.8; }
    .foldthumb { fill: none; stroke: rgba(148,163,184,0.9); stroke-width: 2.2; }
    .thumbpad { fill: rgba(148,163,184,0.10); stroke: rgba(148,163,184,0.85); stroke-width: 1.6; }
    .tipdot { fill: #7df9ff; }
    .tipdot.dim { fill: #fbbf24; }
    .knuckle { fill: none; stroke: #7df9ff; stroke-width: 1.6; }
    .palmline { fill: none; stroke: #7df9ff; stroke-width: 1.2; opacity: .55; }
    .wristband { stroke: #7df9ff; stroke-width: 1.4; opacity: .7; }
    .dimline { stroke: rgba(125,249,255,0.16); stroke-width: 1; }
    .badge { fill: #7df9ff; font: 700 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; }
  </style>
</svg>
